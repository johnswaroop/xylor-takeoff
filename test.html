<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>SVG Overlay Drawing</title>
    <style>
        #container {
            position: relative;
            width: 800px;
            margin: auto;
        }

        #floorplan {
            width: 100%;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="container">
        <img id="floorplan" src="/public/a1.jpg" />
        <svg id="overlay"></svg>
    </div>

    <script>
        const svg = document.getElementById('overlay');
        let points = [];

        svg.addEventListener('click', (e) => {
            const rect = svg.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Draw a point
            const point = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            point.setAttribute('cx', x);
            point.setAttribute('cy', y);
            point.setAttribute('r', 4);
            point.setAttribute('fill', 'red');
            svg.appendChild(point);

            points.push({ x, y });

            if (points.length === 2) {
                const [p1, p2] = points;
                const x1 = Math.min(p1.x, p2.x);
                const y1 = Math.min(p1.y, p2.y);
                const width = Math.abs(p2.x - p1.x);
                const height = Math.abs(p2.y - p1.y);

                const rectElem = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rectElem.setAttribute('x', x1);
                rectElem.setAttribute('y', y1);
                rectElem.setAttribute('width', width);
                rectElem.setAttribute('height', height);
                rectElem.setAttribute('fill', 'rgba(0, 0, 255, 0.2)');
                rectElem.setAttribute('stroke', 'blue');
                svg.appendChild(rectElem);

                points = [];
            }
        });
    </script>
</body>

</html>
